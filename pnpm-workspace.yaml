packages:
  - apps/*
  - packages/*
  - tooling/*

nodeOptions: --max-old-space-size=4096
engineStrict: true

overrides:
  kysely: 0.28.17
  protobufjs: 8.6.4
  "@temporalio/activity": 1.20.3
  "@temporalio/client": 1.20.3
  "@temporalio/common": 1.20.3
  "@temporalio/core-bridge": 1.20.3
  "@temporalio/nexus": 1.20.3
  "@temporalio/proto": 1.20.3
  "@temporalio/testing": 1.20.3
  "@temporalio/worker": 1.20.3
  "@temporalio/workflow": 1.20.3
  ws: ">=8.21.0"
  form-data: ">=4.0.6"
  "postcss@<=8.5.17": ^8.5.18
  "postcss@<=8.5.22": ^8.5.23
  "nanoid@<3.3.18": 3.3.18
  "gaxios>rimraf": 6.1.3
  "brace-expansion": 5.0.9
  "undici": 7.29.0
  "ip-address": 10.3.1
  js-yaml: ^4.3.1
  ts-deepmerge: ">=8.0.0"
  monaco-editor>dompurify: ">=3.4.13"
  isomorphic-dompurify>dompurify: ">=3.4.13"
  "@prisma/dev>@hono/node-server": ^1.19.13
  "@prisma/dev>hono": ">=4.12.25"
  "@sveltejs/kit>cookie": ^0.7.0
  tsx>esbuild: ^0.28.1
  fast-uri: 3.1.5
  "@hono/node-server@<1.19.15": ^1.19.15
  "@sveltejs/kit@<=2.70.1": ^2.70.2
  brace-expansion@>=2.0.0 <2.1.3: ^2.1.3
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=4.0.0 <5.0.8: ^5.0.8
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  dompurify@<=3.4.11: ^3.4.12
  dompurify@<=3.4.12: ^3.4.13
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  hono@<4.12.34: ^4.12.34
  hono@>=3.8.0 <4.12.34: ^4.12.34
  hono@>=4.12.0 <4.12.34: ^4.12.34
  hono@>=4.7.0 <4.12.34: ^4.12.34
  ip-address@<=10.3.0: ^10.3.1
  ip-address@>=10.1.1 <=10.2.0: ^10.2.1
  ip-address@>=10.1.1 <=10.2.1: ^10.2.2
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  protobufjs@>=8.0.0 <=8.6.5: ^8.6.6
  protobufjs@>=8.2.0 <=8.6.4: ^8.6.5
  undici@>=7.0.0 <7.29.0: ^7.29.0
  valibot@<=1.4.1: ^1.4.2

ignoredOptionalDependencies:
  - joi

allowBuilds:
  "@dodona/dolos-parsers": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  prisma: true
  tree-sitter: true
  tree-sitter-compat: true

patchedDependencies:
  tree-sitter@0.25.0: patches/tree-sitter@0.25.0.patch
  "@dodona/dolos-parsers@1.4.1": patches/@dodona__dolos-parsers@1.4.1.patch

catalog:
  # Cross-package shared core deps — must stay version-consistent.
  "@opentelemetry/api": ^1.9.1
  "@playwright/test": ^1.61.1
  "@prisma/adapter-pg": ^7.8.0

  # Prisma client + CLI + adapter must match.
  "@prisma/client": ^7.8.0
  "@temporalio/activity": ^1.21.1

  # Temporal client + worker SDKs must match versions.
  "@temporalio/client": ^1.21.1
  "@temporalio/worker": ^1.21.1
  "@temporalio/testing": ^1.21.1
  "@temporalio/workflow": ^1.21.1
  "@types/node": ^24.13.3
  bcryptjs: ^3.0.3
  esbuild: ^0.28.1
  ioredis: ^5.11.1
  jose: ^6.2.3
  jszip: ^3.10.1
  pino: ^10.3.1
  prisma: ^7.8.0
  rate-limiter-flexible: ^11.2.0

  # Build / test tooling shared across packages.
  tsdown: ^0.22.5
  typescript: ^6.0.3
  vitest: 4.1.10
  zod: ^4.4.3

minimumReleaseAgeExclude:
  - protobufjs@8.6.5 || 8.6.6
  - dompurify@3.4.12 || 3.4.13
  - valibot@1.4.2
  - brace-expansion@2.1.3 || 2.1.4 || 5.0.8 || 5.0.9
  - postcss@8.5.18 || 8.5.23
  - undici@7.29.0
  - fast-uri@3.1.5
  - ip-address@10.2.1 || 10.2.2 || 10.3.1
  - hono@4.12.34
  - js-yaml@4.3.1
  - "@sveltejs/kit@2.70.2"
  - "@hono/node-server@1.19.15"
  - "@wasm-oj/browser@0.2.0"
  - "@wasm-oj/contracts@0.2.0"
  - "@wasm-oj/core@0.2.0"
  - "@wasm-oj/toolchain-clang@0.1.0"
  - "@wasm-oj/toolchain-go@0.1.0"
  - "@wasm-oj/toolchain-java@0.1.0"
  - "@wasm-oj/toolchain-javascript@0.1.0"
  - "@wasm-oj/toolchain-python@0.1.0"
  - "@wasm-oj/toolchain-rust@0.1.0"

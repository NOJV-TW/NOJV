name: Build & Push Images

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: build-images-release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare-release:
    name: Validate release
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'NOJV-TW/NOJV'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch trusted main ref
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Validate trusted version tag and exact checkout
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_ROOT: ${{ github.api_url }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-release-run.mjs

  build-web:
    name: Build & push web image
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable publication state
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_ROOT: ${{ github.api_url }}
          IMAGE_TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: node scripts/validate-release-run.mjs publication-state

      - name: Build or verify web image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PREFIX: ghcr.io/nojv-tw
          EXISTING_IMAGES: ${{ steps.publication.outputs.existing_images }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_IMAGE_NAME: nojv-web
          RELEASE_DOCKERFILE: infra/docker/web.Dockerfile
        run: scripts/build-release-image.sh

      - name: Attest web image
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/nojv-tw/nojv-web
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish web release tag
        if: steps.image.outputs.requires_promotion == 'true'
        env:
          TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PREFIX: ghcr.io/nojv-tw
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_IMAGE_NAME: nojv-web
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: scripts/promote-release-image.sh

  build-worker:
    name: Build & push worker image
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable publication state
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_ROOT: ${{ github.api_url }}
          IMAGE_TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: node scripts/validate-release-run.mjs publication-state

      - name: Build or verify worker image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PREFIX: ghcr.io/nojv-tw
          EXISTING_IMAGES: ${{ steps.publication.outputs.existing_images }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_IMAGE_NAME: nojv-worker
          RELEASE_DOCKERFILE: infra/docker/worker.Dockerfile
        run: scripts/build-release-image.sh

      - name: Attest worker image
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/nojv-tw/nojv-worker
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish worker release tag
        if: steps.image.outputs.requires_promotion == 'true'
        env:
          TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PREFIX: ghcr.io/nojv-tw
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_IMAGE_NAME: nojv-worker
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: scripts/promote-release-image.sh

  build-migrator:
    name: Build & push migrator image
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable publication state
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_ROOT: ${{ github.api_url }}
          IMAGE_TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: node scripts/validate-release-run.mjs publication-state

      - name: Build or verify migrator image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PREFIX: ghcr.io/nojv-tw
          EXISTING_IMAGES: ${{ steps.publication.outputs.existing_images }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_IMAGE_NAME: nojv-migrator
          RELEASE_DOCKERFILE: infra/docker/migrator.Dockerfile
        run: scripts/build-release-image.sh

      - name: Attest migrator image
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/nojv-tw/nojv-migrator
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish migrator release tag
        if: steps.image.outputs.requires_promotion == 'true'
        env:
          TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PREFIX: ghcr.io/nojv-tw
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_IMAGE_NAME: nojv-migrator
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: scripts/promote-release-image.sh

  build-sandbox:
    name: Build & push sandbox image
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable publication state
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_ROOT: ${{ github.api_url }}
          IMAGE_TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: node scripts/validate-release-run.mjs publication-state

      - name: Build or verify sandbox image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PREFIX: ghcr.io/nojv-tw
          EXISTING_IMAGES: ${{ steps.publication.outputs.existing_images }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_IMAGE_NAME: nojv-sandbox
          RELEASE_DOCKERFILE: infra/docker/sandbox-runner.Dockerfile
        run: scripts/build-release-image.sh

      - name: Attest sandbox image
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/nojv-tw/nojv-sandbox
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish sandbox release tag
        if: steps.image.outputs.requires_promotion == 'true'
        env:
          TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PREFIX: ghcr.io/nojv-tw
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_IMAGE_NAME: nojv-sandbox
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: scripts/promote-release-image.sh

  deploy-ref:
    name: Publish verified image tag to deploy branch
    needs:
      - prepare-release
      - build-web
      - build-worker
      - build-migrator
      - build-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify deploy checkout
        env:
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Fetch current deploy ref
        run: git fetch --no-tags origin +refs/heads/deploy:refs/remotes/origin/deploy

      - name: Reject stale deploy candidate
        id: advance
        env:
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: node scripts/validate-release-run.mjs deploy-advance

      - name: Publish immutable image references to the deploy branch
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.prepare-release.outputs.image_tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          IMAGE_DIGEST_WEB: ${{ needs.build-web.outputs.digest }}
          IMAGE_DIGEST_WORKER: ${{ needs.build-worker.outputs.digest }}
          IMAGE_DIGEST_SANDBOX: ${{ needs.build-sandbox.outputs.digest }}
          IMAGE_DIGEST_MIGRATOR: ${{ needs.build-migrator.outputs.digest }}
          DEPLOY_TIP: ${{ steps.advance.outputs.deploy_tip }}
        run: |
          set -euo pipefail
          git config user.name "nojv-deploy-bot"
          git config user.email "nojv-deploy-bot@users.noreply.github.com"
          git checkout -B deploy
          VALUES_FILE=infra/charts/nojv/values-single-machine.yaml
          node scripts/update-deploy-image-values.mjs "$VALUES_FILE"
          git add "$VALUES_FILE"
          git commit -m "deploy: ${IMAGE_TAG}"
          DEPLOY_TAG="nojv-deploy-${IMAGE_TAG}"
          if git ls-remote --exit-code --tags origin "refs/tags/${DEPLOY_TAG}" >/dev/null 2>&1; then
            echo "Immutable deploy tag already exists: ${DEPLOY_TAG}" >&2
            exit 1
          fi
          git tag "$DEPLOY_TAG"
          git push --atomic "--force-with-lease=refs/heads/deploy:${DEPLOY_TIP}" origin \
            refs/heads/deploy:refs/heads/deploy \
            "refs/tags/${DEPLOY_TAG}:refs/tags/${DEPLOY_TAG}"

  verify-production:
    name: Verify production release and notify Discord
    needs:
      - prepare-release
      - deploy-ref
    runs-on: ubuntu-latest
    timeout-minutes: 140
    permissions: {}
    steps:
      - name: Validate release notification configuration
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: ': "${DISCORD_RELEASE_WEBHOOK_URL:?DISCORD_RELEASE_WEBHOOK_URL secret is required}"'

      - name: Wait for the released version to be healthy in production
        env:
          RELEASE_URL: https://nojv.tw
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.image_tag }}
          EXPECTED_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          # ponytail: public stable-sample gate avoids cluster credentials; pod-set inspection would need cluster access.
          consecutive=0
          for attempt in $(seq 1 260); do
            release_json=""
            if release_json="$(curl --silent --show-error --fail --max-time 10 "${RELEASE_URL}/api/release")" \
              && jq -e --arg version "${EXPECTED_VERSION}" --arg sha "${EXPECTED_SHA}" \
                '.version == $version and .sourceSha == $sha' <<<"${release_json}" >/dev/null \
              && curl --silent --show-error --fail --max-time 10 "${RELEASE_URL}/api/livez" >/dev/null \
              && curl --silent --show-error --fail --max-time 10 "${RELEASE_URL}/api/readyz" >/dev/null; then
              consecutive=$((consecutive + 1))
              if [ "${consecutive}" -ge 3 ]; then
                echo "Production is stably serving ${EXPECTED_VERSION} (${EXPECTED_SHA})."
                exit 0
              fi
            else
              consecutive=0
            fi
            if [ "${attempt}" -eq 260 ]; then
              echo "Timed out waiting for production to serve ${EXPECTED_VERSION} (${EXPECTED_SHA})." >&2
              echo "Last release response: ${release_json}" >&2
              exit 1
            fi
            echo "Production is not serving ${EXPECTED_VERSION} yet (attempt ${attempt}/260)."
            sleep 30
          done

      - name: Notify Discord
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_URL: https://nojv.tw
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.image_tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg version "${RELEASE_VERSION}" \
            --arg sha "${RELEASE_SHA}" \
            --arg releaseUrl "${RELEASE_URL}" \
            '{embeds: [{title: "NOJV public production deployed", description: ("Version: " + $version + "\nCommit: " + $sha), url: $releaseUrl, color: 5763719}]}')"
          curl --silent --show-error --fail --max-time 15 \
            -H "content-type: application/json" \
            --data "${payload}" \
            "${DISCORD_RELEASE_WEBHOOK_URL}"

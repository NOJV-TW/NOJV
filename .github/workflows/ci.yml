name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nojv_test
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nojv_test
  NOJV_DESTRUCTIVE_TEST_DATABASE: nojv_test

jobs:
  verify:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nojv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup

      - name: Mark the destructive test database
        run: >-
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "COMMENT ON DATABASE nojv_test IS 'NOJV_TEST_DATABASE:nojv_test'"

      - name: Build @nojv/storage dependency chain for seed validator
        run: pnpm --filter @nojv/storage... build

      - name: Validate problem seed definitions (dry-run)
        run: pnpm db:seed:validate

      - name: Verify migrations apply cleanly and match schema (no drift)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE nojv_migrate_check;'
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/nojv_migrate_check
          pnpm --filter @nojv/db exec prisma migrate deploy
          pnpm --filter @nojv/db exec prisma migrate diff \
            --from-config-datasource --to-schema prisma/schema --exit-code

      - name: Verify generated DB schema docs are in sync (no drift)
        run: |
          pnpm db:docs
          git diff --exit-code docs/architecture/DATABASE.generated.md

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0

      - name: Lint and render the Helm umbrella chart
        run: pnpm lint:helm

      - name: Restore Turborepo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Verify monorepo (build, lint, typecheck, unit tests)
        run: pnpm ci:verify
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          TURBO_CACHE_DIR: .turbo/cache
          TURBO_RUN_SUMMARY: "true"

      - name: Keep only this run's Turborepo cache entries
        run: |
          set -euo pipefail
          jq -r '.tasks[].hash' .turbo/runs/*.json | sort -u > "$RUNNER_TEMP/turbo-hashes"
          find .turbo/cache -maxdepth 1 -type f | while read -r entry; do
            name="$(basename "$entry")"
            grep -qxF "${name%%[-.]*}" "$RUNNER_TEMP/turbo-hashes" || rm -f "$entry"
          done
          du -sh .turbo/cache

      - name: Save Turborepo cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  coverage:
    name: Unit and integration coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nojv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup

      - name: Mark the destructive test database
        run: >-
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "COMMENT ON DATABASE nojv_test IS 'NOJV_TEST_DATABASE:nojv_test'"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0

      - name: Prepare coverage runtime
        run: |
          pnpm --filter @nojv/storage... build
          pnpm --filter @nojv/web paraglide:compile
          pnpm --filter @nojv/web exec svelte-kit sync

      - name: Download Temporal test servers
        run: scripts/download-temporal-test-servers.sh

      - name: Run integration tests with coverage gate
        run: pnpm test:coverage
        env:
          APP_BASE_URL: http://localhost:5173
          MAILER_MODE: sink
          NODE_ENV: test
          NODE_OPTIONS: "--max-old-space-size=4096"

  temporal:
    name: Temporal workflow integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup

      - name: Build workflow bundle dependencies
        run: pnpm --filter @nojv/storage... build

      - name: Download Temporal test servers
        run: scripts/download-temporal-test-servers.sh

      - name: Run Temporal workflow integration tests
        run: pnpm test:integration:temporal
        env:
          NODE_ENV: test
          NODE_OPTIONS: "--max-old-space-size=4096"

  verify-gate:
    name: Verify Repository
    if: always()
    needs:
      - verify
      - coverage
      - temporal
      - storage-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require repository checks, coverage, Temporal and storage conformance
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          TEMPORAL_RESULT: ${{ needs.temporal.result }}
          STORAGE_RESULT: ${{ needs.storage-conformance.result }}
        run: >-
          test "$VERIFY_RESULT" = success &&
          test "$COVERAGE_RESULT" = success &&
          test "$TEMPORAL_RESULT" = success &&
          test "$STORAGE_RESULT" = success

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Hard gate: any high or critical advisory fails the build.
      # Moderate/low are reported by `pnpm audit` locally but not gated.
      # Suppress a genuinely-unfixable advisory via
      # `auditConfig.ignoreGhsas` in pnpm-workspace.yaml.
      - name: Audit dependencies (high + critical)
        run: pnpm audit --audit-level high

  browser-smoke:
    name: Core browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nojv_e2e_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nojv_e2e_test
      NOJV_DESTRUCTIVE_TEST_DATABASE: nojv_e2e_test
      REDIS_URL: redis://127.0.0.1:6379

    services:
      postgres:
        image: postgres:18@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nojv_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup

      - name: Restore Turborepo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build web dependency chain
        run: pnpm turbo run build --filter=@nojv/web...
        env:
          TURBO_CACHE_DIR: .turbo/cache

      - name: Mark the isolated browser-test database
        run: >-
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "COMMENT ON DATABASE nojv_e2e_test IS 'NOJV_TEST_DATABASE:nojv_e2e_test'"

      - name: Start isolated object storage
        run: |
          set -euo pipefail
          docker run --detach --name nojv-e2e-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            ghcr.io/nojv-tw/minio:RELEASE.2025-04-22T22-12-26Z@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb \
            server /data
          for attempt in {1..30}; do
            if node -e 'fetch("http://127.0.0.1:9000/minio/health/ready").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs nojv-e2e-minio
              exit 1
            fi
            sleep 1
          done

      - name: Create browser-test object-storage bucket
        working-directory: packages/storage
        run: |
          node --input-type=module <<'NODE'
          import { CreateBucketCommand, HeadBucketCommand, S3Client } from '@aws-sdk/client-s3';

          const client = new S3Client({
            endpoint: 'http://127.0.0.1:9000',
            region: 'us-east-1',
            forcePathStyle: true,
            credentials: { accessKeyId: 'minioadmin', secretAccessKey: 'minioadmin' },
          });
          await client.send(new CreateBucketCommand({ Bucket: 'nojv' }));
          await client.send(new HeadBucketCommand({ Bucket: 'nojv' }));
          await client.destroy();
          NODE

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run core browser flows
        run: >-
          pnpm exec playwright test --config tests/e2e/playwright.config.ts
          tests/e2e/auth.test.ts tests/e2e/dashboard.test.ts tests/e2e/problems.test.ts
          tests/e2e/course-roster.test.ts tests/e2e/course-roster-activation.test.ts
          tests/e2e/exam-access-safety.test.ts

  storage-conformance:
    name: Object storage conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup

      - name: Build storage package
        run: pnpm --filter @nojv/storage... build

      - name: Start Versity S3 Gateway with its buckets
        run: docker compose -f infra/docker/s3-conformance/compose.yml --profile versity run --rm versity-init

      - name: Run S3 conformance against Versity
        run: pnpm test:integration:storage
        env:
          S3_CONFORMANCE: "1"
          S3_ENDPOINT: http://127.0.0.1:9200
          S3_ACCESS_KEY: conformance
          S3_SECRET_KEY: conformance-secret
          S3_BUCKET: nojv
          S3_REGION: us-east-1

      - name: Show gateway logs
        if: failure()
        run: docker compose -f infra/docker/s3-conformance/compose.yml --profile versity logs versity

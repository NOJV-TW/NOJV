apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - temporal.yaml
configMapGenerator:
  - name: temporal-values
    namespace: nojv-temporal
    files:
      - values.yaml=temporal-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled

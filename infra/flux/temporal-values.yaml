# Production single-machine Temporal values for the official temporal/temporal chart:
# one pod per role on the nojv chart's CNPG cluster (nojv-pg-rw). Flux applies this
# file as ConfigMap temporal-values to HelmRelease temporal (temporal.yaml), which
# pins the chart version. Create the temporal role, databases and Secret first
# (infra/gcp/gke/temporal/HA-PRODUCTION.md).
server:
  replicaCount: 1
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            pluginName: postgres12
            databaseName: temporal
            connectAddr: nojv-pg-rw.nojv.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgres-secret
            secretKey: password
            createDatabase: false
            manageSchema: true
            maxConns: 10
        visibility:
          sql:
            pluginName: postgres12
            databaseName: temporal_visibility
            connectAddr: nojv-pg-rw.nojv.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgres-secret
            secretKey: password
            createDatabase: false
            manageSchema: true
            maxConns: 10
  # Must match infra/docker/temporal-dynamic-config.yaml (docs/runbooks/judge-queue.md).
  dynamicConfig:
    matching.enableFairness:
      - value: true
    matching.useNewMatcher:
      - value: true
    matching.numTaskqueueWritePartitions:
      - value: 1
        constraints: { taskQueueName: judge }
      - value: 1
        constraints: { taskQueueName: judge-state }
      - value: 1
        constraints: { taskQueueName: platform }
    matching.numTaskqueueReadPartitions:
      - value: 1
        constraints: { taskQueueName: judge }
      - value: 1
        constraints: { taskQueueName: judge-state }
      - value: 1
        constraints: { taskQueueName: platform }
  nodeSelector:
    nojv-role: sandbox
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # History holds workflow state; 1Gi was OOMKilled when 100 judge workflows
  # started together (2026-09-26). Setting a service's resources replaces the
  # whole block, so cpu is repeated.
  history:
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 2Gi

# Built-in single-pod Postgres/Cassandra/Elasticsearch/Prometheus/Grafana subcharts
# were removed upstream (v1.0.0-rc.2). SQL visibility (above) needs no Elasticsearch.

# Temporal Web UI — not needed; the nojv app embeds its own dashboards.
web:
  enabled: false

name: nojv-s3-conformance

x-hardened: &hardened
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

x-bucket-init: &bucket-init
  image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
  restart: "no"
  entrypoint: ["/bin/sh", "-c", "rclone mkdir s3:nojv && rclone mkdir s3:nojv-registry"]

x-registry: &registry
  image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
  <<: *hardened
  command: ["serve", "/etc/distribution/config.yml"]
  tmpfs: [/tmp, /var/lib/registry]
  volumes: [./registry.yml:/etc/distribution/config.yml:ro]

services:
  minio:
    profiles: [minio]
    image: ghcr.io/nojv-tw/minio:RELEASE.2025-04-22T22-12-26Z@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb
    platform: linux/amd64
    <<: *hardened
    command: server /data
    environment:
      MINIO_ROOT_USER: conformance
      MINIO_ROOT_PASSWORD: conformance-secret
      MC_CONFIG_DIR: /tmp/.mc
    ports: ["127.0.0.1:9100:9000"]
    volumes: [minio_data:/data]
    depends_on:
      minio-volume:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 30

  minio-volume:
    profiles: [minio]
    image: ghcr.io/nojv-tw/minio:RELEASE.2025-04-22T22-12-26Z@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb
    platform: linux/amd64
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/data"]
    volumes: [minio_data:/data]

  minio-init:
    profiles: [minio]
    <<: *bucket-init
    environment:
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: Minio
      RCLONE_CONFIG_S3_ENDPOINT: http://minio:9000
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: conformance
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: conformance-secret
    depends_on:
      minio:
        condition: service_healthy

  minio-registry:
    profiles: [minio]
    <<: *registry
    environment:
      REGISTRY_STORAGE_S3_REGIONENDPOINT: http://minio:9000
      REGISTRY_STORAGE_S3_ACCESSKEY: conformance
      REGISTRY_STORAGE_S3_SECRETKEY: conformance-secret
    ports: ["127.0.0.1:5100:5000"]
    depends_on:
      minio-init:
        condition: service_completed_successfully

  versity:
    profiles: [versity]
    image: ghcr.io/versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    <<: *hardened
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_PORT: ":9000"
      ROOT_ACCESS_KEY: conformance
      ROOT_SECRET_KEY: conformance-secret
    ports: ["127.0.0.1:9200:9000"]
    volumes: [versity_data:/data]
    depends_on:
      versity-volume:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      retries: 30

  versity-volume:
    profiles: [versity]
    image: ghcr.io/versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/data"]
    volumes: [versity_data:/data]

  versity-init:
    profiles: [versity]
    <<: *bucket-init
    environment:
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: Other
      RCLONE_CONFIG_S3_ENDPOINT: http://versity:9000
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: conformance
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: conformance-secret
    depends_on:
      versity:
        condition: service_healthy

  versity-registry:
    profiles: [versity]
    <<: *registry
    environment:
      REGISTRY_STORAGE_S3_REGIONENDPOINT: http://versity:9000
      REGISTRY_STORAGE_S3_ACCESSKEY: conformance
      REGISTRY_STORAGE_S3_SECRETKEY: conformance-secret
    ports: ["127.0.0.1:5200:5000"]
    depends_on:
      versity-init:
        condition: service_completed_successfully

  seaweedfs:
    profiles: [seaweedfs]
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    <<: *hardened
    command:
      [
        "mini",
        "-dir=/data",
        "-s3.port=9000",
        "-s3.config=/etc/seaweedfs/s3.json",
        "-admin.ui=false",
      ]
    ports: ["127.0.0.1:9300:9000"]
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      seaweedfs-volume:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      retries: 30

  seaweedfs-volume:
    profiles: [seaweedfs]
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/data"]
    volumes: [seaweedfs_data:/data]

  seaweedfs-init:
    profiles: [seaweedfs]
    <<: *bucket-init
    environment:
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: SeaweedFS
      RCLONE_CONFIG_S3_ENDPOINT: http://seaweedfs:9000
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: conformance
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: conformance-secret
    depends_on:
      seaweedfs:
        condition: service_healthy

  seaweedfs-registry:
    profiles: [seaweedfs]
    <<: *registry
    environment:
      REGISTRY_STORAGE_S3_REGIONENDPOINT: http://seaweedfs:9000
      REGISTRY_STORAGE_S3_ACCESSKEY: conformance
      REGISTRY_STORAGE_S3_SECRETKEY: conformance-secret
    ports: ["127.0.0.1:5300:5000"]
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully

volumes:
  minio_data:
  versity_data:
  seaweedfs_data:

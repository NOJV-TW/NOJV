{{- if and .Values.storage.inCluster .Values.storage.minio.backup.enabled }}
{{- $schedule := required "storage.minio.backup.schedule is required when backup is enabled" .Values.storage.minio.backup.schedule }}
{{- $endpoint := required "storage.minio.backup.destinationEndpoint is required when backup is enabled" .Values.storage.minio.backup.destinationEndpoint }}
{{- $bucket := required "storage.minio.backup.destinationBucket is required when backup is enabled" .Values.storage.minio.backup.destinationBucket }}
{{- $region := required "storage.minio.backup.destinationRegion is required when backup is enabled" .Values.storage.minio.backup.destinationRegion }}
{{- $provider := required "storage.minio.backup.destinationProvider is required when backup is enabled" .Values.storage.minio.backup.destinationProvider }}
{{- $credentialsSecret := required "storage.minio.backup.credentialsSecret is required when backup is enabled" .Values.storage.minio.backup.credentialsSecret }}
{{- if not (regexMatch "^https://[^[:space:]]+$" $endpoint) }}
{{- fail "storage.minio.backup.destinationEndpoint must use HTTPS" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" $bucket) }}
{{- fail "storage.minio.backup.destinationBucket must be a valid S3 bucket name" }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9]+$" $provider) }}
{{- fail "storage.minio.backup.destinationProvider must be an rclone S3 provider name" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $credentialsSecret) }}
{{- fail "storage.minio.backup.credentialsSecret must be a valid Kubernetes Secret name" }}
{{- end }}
{{- $source := include "nojv.activeStoreService" . }}
{{- $sourceBuckets := list .Values.storage.bucket }}
{{- if .Values.registry.enabled }}
{{- $sourceBuckets = append $sourceBuckets .Values.registry.bucket }}
{{- end }}
{{/*
Off-host mirror of the in-cluster store selected by storage.active → an S3/R2
target the local PVC does not depend on. The in-cluster store holds the ONLY
copy of student submission sources, so this is a data-safety backup. Rendered
only when storage.inCluster AND storage.minio.backup.enabled — disabled =
nothing here, so no dangling reference to the credentials Secret. Each source
bucket lands under <destinationBucket>/<bucket>/ via `rclone copy --metadata`
(never sync: objects deleted from the source are kept in the mirror as an extra
safety net). The destination bucket must already exist; the job never creates
it, so a bucket-scoped R2 token is enough. See docs/runbooks/backup-restore.md.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nojv.fullname" . }}-minio-backup
  namespace: {{ include "nojv.namespace" . }}
  labels:
    {{- include "nojv.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-backup
spec:
  schedule: {{ $schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nojv-minio-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: rclone-home
              emptyDir: {}
          containers:
            - name: rclone
              image: {{ .Values.storage.rclone.image }}
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  for bucket in $SRC_BUCKETS; do
                    rclone copy --metadata "src:$bucket" "dst:$DST_BUCKET/$bucket"
                  done
              volumeMounts:
                - name: rclone-home
                  mountPath: /tmp
              env:
                - name: HOME
                  value: /tmp
                - name: SRC_BUCKETS
                  value: {{ join " " $sourceBuckets | quote }}
                - name: DST_BUCKET
                  value: {{ $bucket | quote }}
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: s3
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: {{ ternary "Minio" "Other" (eq .Values.storage.active "minio") }}
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  value: {{ printf "http://%s.%s.svc:9000" $source (include "nojv.namespace" .) | quote }}
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "nojv.runtimeSecretName" . }}
                      key: S3_ACCESS_KEY
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "nojv.runtimeSecretName" . }}
                      key: S3_SECRET_KEY
                - name: RCLONE_CONFIG_DST_TYPE
                  value: s3
                - name: RCLONE_CONFIG_DST_PROVIDER
                  value: {{ $provider | quote }}
                - name: RCLONE_CONFIG_DST_ENDPOINT
                  value: {{ $endpoint | quote }}
                - name: RCLONE_CONFIG_DST_REGION
                  value: {{ $region | quote }}
                - name: RCLONE_CONFIG_DST_NO_CHECK_BUCKET
                  value: "true"
                - name: RCLONE_CONFIG_DST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ $credentialsSecret }}
                      key: ACCESS_KEY_ID
                - name: RCLONE_CONFIG_DST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $credentialsSecret }}
                      key: ACCESS_SECRET_KEY
              resources:
                {{- toYaml .Values.storage.minio.backup.resources | nindent 16 }}
{{- end }}

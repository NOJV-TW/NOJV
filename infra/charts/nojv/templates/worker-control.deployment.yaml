{{- if .Values.worker.sandbox.capacityAdmission.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nojv.fullname" . }}-worker-control
  namespace: {{ include "nojv.namespace" . }}
  labels:
    {{- include "nojv.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-control
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nojv-worker-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nojv-worker-control
        nojv-role: worker
    spec:
      serviceAccountName: {{ include "nojv.fullname" . }}-worker-judge
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 120
      {{- with .Values.worker.judge.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-control
          image: {{ include "nojv.image" (dict "root" . "component" "worker") }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "8080" }
            - { name: WORKER_MODE, value: control }
            - { name: EXECUTION_BACKEND, value: kubernetes }
            - { name: WORKER_CONCURRENCY, value: "4" }
            - { name: K8S_CAPACITY_ADMISSION, value: "true" }
            - { name: K8S_CPU_REQUEST, value: "1" }
            - { name: K8S_CASE_CPU_REQUEST, value: "1" }
            - { name: K8S_CPU_LIMIT, value: "1" }
            - { name: K8S_MEMORY_REQUEST, value: "512Mi" }
            - { name: K8S_MEMORY_LIMIT, value: "512Mi" }
            - { name: K8S_MAX_PARALLEL_CASES, value: "4" }
            - { name: K8S_RUNTIME_CLASS_NAME, value: gvisor }
            - name: K8S_NAMESPACE
              value: {{ include "nojv.sandboxNamespace" . }}
            - name: K8S_ARTIFACT_STORAGE_CLASS
              value: {{ .Values.worker.sandbox.capacityAdmission.artifactStorageClassName | quote }}
            - name: SANDBOX_IMAGE
              value: {{ include "nojv.image" (dict "root" . "component" "sandbox") }}
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            {{- include "nojv.databaseUrlEnv" . | nindent 12 }}
            {{- range $key := list "REDIS_URL" "S3_ENDPOINT" "S3_ACCESS_KEY" "S3_SECRET_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "nojv.runtimeSecretName" $ }}
                  key: {{ $key }}
            {{- end }}
            - name: S3_BUCKET
              value: {{ .Values.storage.bucket | quote }}
            {{- range $key := list "OTEL_EXPORTER_OTLP_ENDPOINT" "OTEL_EXPORTER_OTLP_HEADERS" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "nojv.runtimeSecretName" $ }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
        {{- if .Values.cloudsqlProxy.enabled }}
        - name: cloudsql-proxy
          image: {{ .Values.postgres.cloudsql.proxyImage }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --address=127.0.0.1
            - --port=5432
            - --private-ip
            - --structured-logs
            - $(CLOUDSQL_INSTANCE_CONNECTION_NAME)
          env:
            - name: CLOUDSQL_INSTANCE_CONNECTION_NAME
              value: {{ .Values.postgres.cloudsql.instanceConnectionName | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
{{- end }}

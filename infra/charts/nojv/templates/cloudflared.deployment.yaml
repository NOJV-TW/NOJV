{{- if .Values.edge.cloudflared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nojv.fullname" . }}-cloudflared
  namespace: {{ include "nojv.namespace" . }}
  labels:
    {{- include "nojv.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudflared
spec:
  replicas: {{ .Values.edge.cloudflared.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nojv-cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nojv-cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: {{ .Values.edge.cloudflared.image }}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            # http2, not the default quic: the origin sits behind NAT, where an
            # idle UDP mapping expires and leaves the edge holding a registered
            # connection cloudflared can no longer answer on. Requests routed to
            # it stall until the client times out, and re-registration is then
            # rejected as dup_edge_conn.
            - name: TUNNEL_TRANSPORT_PROTOCOL
              value: http2
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.edge.cloudflared.tokenSecret }}
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
{{/*
Headless Service for the metrics endpoint cloudflared already serves on :2000.
Headless, not ClusterIP: the DNS A records resolve to every replica, so
Prometheus scrapes each cloudflared separately instead of round-robining and
blending two tunnels' connection counts into one unreadable series.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nojv.fullname" . }}-cloudflared-metrics
  namespace: {{ include "nojv.namespace" . }}
  labels:
    {{- include "nojv.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudflared
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nojv-cloudflared
  ports:
    - name: metrics
      port: 2000
      targetPort: metrics
{{- end }}

{{- $releaseMaintenance := and .Release.IsUpgrade .Values.migrator.enabled .Values.migrator.releaseWindow -}}
{{- if ne .Values.worker.sandbox.runtimeClassName "gvisor" }}
{{- fail "worker.sandbox.runtimeClassName must be gvisor" }}
{{- end }}
{{- $quota := .Values.sandbox.resourceQuota -}}
{{- if and $quota.enabled (regexMatch "^[0-9]+$" (toString $quota.requestsCpu)) }}
{{- $cores := mul (int .Values.worker.judge.replicas) (int .Values.worker.judge.concurrency) (int .Values.worker.sandbox.runParallelism) }}
{{- if gt (int $cores) (int $quota.requestsCpu) }}
{{- fail (printf "worker.judge replicas x concurrency x worker.sandbox.runParallelism (%d) exceeds sandbox.resourceQuota.requestsCpu (%s)" (int $cores) (toString $quota.requestsCpu)) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nojv.fullname" . }}-worker
  namespace: {{ include "nojv.namespace" . }}
  labels:
    {{- include "nojv.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-judge
spec:
  replicas: {{ ternary 0 .Values.worker.judge.replicas $releaseMaintenance }}
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nojv-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nojv-worker
        nojv-role: worker
        nojv.tw/schema-contract: versioned-storage-v1
        nojv.tw/course-roster-contract: membership-v1
        nojv.tw/problem-library-contract: problem-library-v1
    spec:
      serviceAccountName: {{ include "nojv.fullname" . }}-worker-judge
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 120
      {{- with .Values.worker.judge.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "nojv.topologySpread" "nojv-worker" | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.cloudsqlProxy.enabled }}
      initContainers:
        {{- include "nojv.cloudsqlProxySidecar" . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "nojv.image" (dict "root" . "component" "worker") }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: WORKER_MODE
              value: judge
            - name: EXECUTION_BACKEND
              value: kubernetes
            - name: K8S_NAMESPACE
              value: {{ include "nojv.sandboxNamespace" . }}
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SANDBOX_IMAGE
              value: {{ include "nojv.image" (dict "root" . "component" "sandbox") }}
            {{- with .Values.worker.sandbox.imagePullSecret }}
            - name: K8S_IMAGE_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            - name: WORKER_CONCURRENCY
              value: {{ .Values.worker.judge.concurrency | quote }}
            {{- with .Values.worker.judge.minConcurrency }}
            - name: WORKER_MIN_CONCURRENCY
              value: {{ . | quote }}
            {{- end }}
            - name: K8S_CPU_REQUEST
              value: {{ .Values.worker.sandbox.cpuRequest | quote }}
            - name: K8S_CPU_LIMIT
              value: {{ .Values.worker.sandbox.cpuLimit | quote }}
            - name: K8S_MEMORY_REQUEST
              value: {{ .Values.worker.sandbox.memoryRequest | quote }}
            - name: K8S_MEMORY_LIMIT
              value: {{ .Values.worker.sandbox.memoryLimit | quote }}
            - name: K8S_RUN_PARALLELISM
              value: {{ .Values.worker.sandbox.runParallelism | quote }}
            - name: K8S_RUNTIME_CLASS_NAME
              value: {{ required "worker.sandbox.runtimeClassName is required" .Values.worker.sandbox.runtimeClassName | quote }}
            {{- if .Values.registry.enabled }}
            - name: REGISTRY_GC_IMAGE
              value: {{ .Values.registry.image | quote }}
            - name: REGISTRY_GC_NAMESPACE
              value: {{ include "nojv.namespace" . | quote }}
            - name: REGISTRY_GC_CONFIG_CONFIGMAP
              value: {{ printf "%s-registry-config" (include "nojv.fullname" .) | quote }}
            - name: REGISTRY_GC_S3_SECRET
              value: {{ include "nojv.runtimeSecretName" . | quote }}
            {{- end }}
            {{- include "nojv.databaseUrlEnv" . | nindent 12 }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "nojv.runtimeSecretName" . }}
                  key: REDIS_URL
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "nojv.runtimeSecretName" . }}
                  key: S3_ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nojv.runtimeSecretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nojv.runtimeSecretName" . }}
                  key: S3_SECRET_KEY
            - name: S3_BUCKET
              value: {{ .Values.storage.bucket | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "nojv.runtimeSecretName" . }}
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "nojv.runtimeSecretName" . }}
                  key: OTEL_EXPORTER_OTLP_HEADERS
                  optional: true
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          ports:
            - containerPort: 8080
              name: health
          resources:
            {{- toYaml .Values.worker.judge.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

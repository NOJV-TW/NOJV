release:
  # build-images.yml replaces this with the commit selected by the release tag.
  sourceSha: 6309b7e978d0b5875f7e92eeff13c06ababbf7c3

image:
  registry: ghcr.io
  repositoryPrefix: nojv-tw
  tag: v1.3.66
  # The release workflow replaces these with Buildx's registry-returned digests
  # on the deploy branch. Empty values intentionally make direct renders fail.
  digests:
    web: sha256:505959d8f8b744f8292793c7d50080675407f0eb1b9deee7117b0f8514a09d2c
    worker: sha256:c90365f57e094925be055bb6205e757835c778fca532a1208113a62535077a29
    sandbox: sha256:749bf8b36274b33bbe31a69732d538f6a97d9e789984ab5316209a20da7ad45b
    migrator: sha256:d0d1da2e893eefb5e6cbf137bc8f7b52aeaa2301e4d638f05b09124be8f9b47c
  repositories:
    web: nojv-web
    worker: nojv-worker
    sandbox: nojv-sandbox
    migrator: nojv-migrator

postgres:
  mode: cnpg
  cnpg:
    instances: 1
    storageSize: 5Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 2Gi
    # DATA-SAFETY: this is the ONLY durable store (app + Temporal state) and a
    # single node has no HA. Production rendering fails until the weekly pg_dump
    # has an off-host R2/S3 destination and an existing Secret name:
    #   1. create the destination bucket (the dump never creates it)
    #   2. kubectl -n nojv create secret generic nojv-object-mirror-r2 \
    #        --from-literal=ACCESS_KEY_ID=<r2-access-key> \
    #        --from-literal=ACCESS_SECRET_KEY=<r2-secret-key>
    #   3. fill destinationEndpoint/destinationBucket/credentialsSecret below
    #   4. redeploy, run the restore drill in docs/runbooks/backup-restore.md.
    dump:
      enabled: true
      destinationEndpoint: "" # https://<account>.r2.cloudflarestorage.com
      destinationBucket: "" # nojv-object-mirror
      credentialsSecret: "" # nojv-object-mirror-r2

cloudsqlProxy:
  enabled: false

redis:
  inCluster: true

storage:
  inCluster: true
  # Versity runs next to MinIO with its own PVC and buckets; MinIO stays
  # storage.active until the owner-run cut-over.
  objectStore:
    enabled: true
  minio:
    storageClass:
      create: true
      name: nojv-minio-retain
      provisioner: rancher.io/local-path
      volumeBindingMode: WaitForFirstConsumer
    # DATA-SAFETY: the in-cluster store holds the ONLY copy of student submission
    # sources (see packages/storage keys). Production rendering fails until an
    # off-host R2/S3 destination and existing Secret name are configured:
    #   1. create the destination bucket (the mirror never creates it)
    #   2. kubectl -n nojv create secret generic nojv-minio-mirror \
    #        --from-literal=ACCESS_KEY_ID=<r2-access-key> \
    #        --from-literal=ACCESS_SECRET_KEY=<r2-secret-key>
    #      (may reuse the pg_dump Secret if it targets the same account)
    #   3. fill destinationEndpoint/destinationBucket/credentialsSecret below
    #   4. redeploy, check the CronJob's first run logs.
    backup:
      enabled: true
      destinationEndpoint: "" # https://<account>.r2.cloudflarestorage.com
      destinationBucket: "" # nojv-minio-mirror
      destinationRegion: "auto"
      credentialsSecret: "" # nojv-minio-mirror

seed:
  enabled: true

migrator:
  # build-images.yml sets this to false when the release adds no migration, so
  # the upgrade rolls out without draining the workloads.
  releaseWindow: false

web:
  replicas: 1
  advancedImageAllowedRegistries: "registry.nojv.tw,ghcr.io,docker.io,quay.io,registry.gitlab.com,gcr.io,public.ecr.aws,mcr.microsoft.com,registry.k8s.io"
  hpa:
    enabled: true
    min: 1
    max: 3
    targetCPU: 70
  ingress:
    enabled: false
  service:
    type: ClusterIP

registry:
  enabled: true
  host: registry.nojv.tw
  token:
    realm: https://nojv.tw/api/registry/token

edge:
  cloudflared:
    enabled: true

observability:
  collector:
    enabled: true
  prometheus:
    enabled: true
    # Node/disk metrics — closes the 2026-07-04 disk-full detection gap on the box.
    nodeExporter:
      enabled: true
  grafana:
    enabled: true
    alerting:
      enabled: true

worker:
  judge:
    replicas: 1
    concurrency: "8"
    minConcurrency: "2"
    resources:
      requests:
        memory: 1Gi
      limits:
        cpu: null
        memory: 3Gi
  platform:
    replicas: 1
    submissionPendingTimeoutMinutes: 10
  sandbox:
    imagePullSecret: nojv-registry-pull
    cpuRequest: "300m"

pdb:
  enabled: false

networkPolicy:
  enabled: false

sandbox:
  networkPolicy:
    enabled: true
  resourceQuota:
    enabled: true
    pods: "16"
    requestsCpu: "6"
    requestsMemory: "16Gi"
  limitRange:
    enabled: true
    min:
      cpu: "15m"
